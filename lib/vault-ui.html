<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebMCP Vault</title>
  <style nonce="{{NONCE}}">
    :root {
      color-scheme: light;
      --paper: #EDEBE6;
      --surface: #FBFAF8;
      --sunk: #E7E5DF;
      --ink: #1A1B1E;
      --muted: #625F58;
      --line: #D6D4CC;
      --live: #C67A1E;
      --live-weak: #EFE2CC;
      --danger: #A3341F;
      --ok: #3F6B44;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --fs-label: 11px;
      --fs-meta: 12px;
      --fs-body: 14px;
      --fs-app: 19px;
      --fs-code: 28px;
      --fw-body: 400;
      --fw-medium: 500;
      --fw-strong: 600;
      --tracking-label: 0.08em;
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 20px;
      --s6: 24px;
      --s7: 32px;
      --s8: 48px;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --border: 1px solid var(--line);
      --shadow-card: 0 1px 2px rgba(26, 27, 30, 0.04);
      --shadow-float: 0 12px 40px -12px rgba(26, 27, 30, 0.28);
      --dur-fast: 120ms;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --focus: 2px solid var(--live);
      --focus-offset: 2px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-body);
      line-height: 1.45;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    .hidden { display: none !important; }
    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .lock-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--s5);
    }
    .lockcard {
      width: min(100%, 400px);
      padding: var(--s7);
      border: var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      box-shadow: var(--shadow-float);
      text-align: center;
    }
    .seal {
      width: 44px;
      height: 44px;
      margin: 0 auto var(--s4);
      color: var(--ink);
    }
    .lockcard h1 {
      margin: 0 0 var(--s1);
      font-size: 18px;
      font-weight: var(--fw-strong);
      line-height: 1.25;
    }
    .lockcard p {
      margin: 0 0 var(--s5);
      color: var(--muted);
      font-size: 13px;
    }
    .lockcard label {
      display: block;
      margin-bottom: 6px;
      text-align: left;
    }
    .lockrow {
      display: flex;
      align-items: center;
      gap: var(--s2);
      margin-top: var(--s4);
    }
    .lockrow .btn {
      flex: 1;
      justify-content: center;
    }
    .hint {
      margin: var(--s4) 0 0;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--fs-label);
      overflow-wrap: anywhere;
    }
    .app-shell {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: var(--s7);
    }
    .app {
      overflow: hidden;
      border: var(--border);
      border-radius: var(--r-lg);
      background: var(--surface);
      box-shadow: var(--shadow-card);
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s4);
      padding: var(--s4) var(--s5);
      border-bottom: var(--border);
      background: var(--surface);
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: var(--s3);
    }
    .brand svg { flex: none; }
    .brand h1 {
      margin: 0;
      font-size: var(--fs-app);
      font-weight: var(--fw-strong);
      line-height: 1.2;
    }
    .path {
      max-width: 320px;
      overflow: hidden;
      padding: 2px var(--s2);
      border: var(--border);
      border-radius: var(--r-sm);
      background: var(--sunk);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-right {
      display: flex;
      align-items: center;
      gap: var(--s4);
    }
    .count {
      color: var(--muted);
      font-size: var(--fs-meta);
      white-space: nowrap;
    }
    .count b {
      color: var(--ink);
      font-weight: var(--fw-strong);
    }
    .status {
      min-width: 80px;
      max-width: 280px;
      color: var(--muted);
      font-size: var(--fs-meta);
      overflow-wrap: anywhere;
      text-align: right;
    }
    .status[data-kind="success"] { color: var(--ok); }
    .status[data-kind="error"] { color: var(--danger); }
    .main {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      height: 560px;
    }
    .rail,
    .detail { min-width: 0; }
    .rail {
      display: flex;
      flex-direction: column;
      border-right: var(--border);
      background: var(--surface);
    }
    .rail-top { padding: var(--s4); }
    .search {
      width: 100%;
      height: 38px;
      padding: 0 var(--s3);
      border: var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--ink);
    }
    .search::placeholder,
    input::placeholder,
    textarea::placeholder { color: var(--muted); }
    .list {
      flex: 1;
      overflow: auto;
      padding: 0 var(--s3) var(--s3);
    }
    .item {
      width: 100%;
      min-width: 0;
      display: grid;
      gap: 2px;
      padding: var(--s3);
      border: 0;
      border-left: 2px solid transparent;
      border-radius: var(--r-md);
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .item:hover,
    .item.active {
      background: var(--sunk);
    }
    .item.active { border-left-color: var(--live); }
    .item .name {
      overflow: hidden;
      font-size: var(--fs-body);
      font-weight: var(--fw-strong);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item .meta {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--fs-meta);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-state {
      display: grid;
      gap: var(--s3);
      padding: var(--s4);
      color: var(--muted);
      font-size: var(--fs-meta);
      line-height: 1.45;
    }
    .empty-state strong {
      color: var(--ink);
      font-size: var(--fs-title);
      font-weight: var(--fw-strong);
    }
    .empty-state p { margin: 0; }
    .empty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2);
    }
    .rail-foot {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2);
      padding: var(--s3) var(--s4);
      border-top: var(--border);
    }
    .detail {
      overflow-y: auto;
      padding: var(--s6);
    }
    .eyebrow,
    label {
      color: var(--muted);
      font-size: var(--fs-label);
      font-weight: var(--fw-strong);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
    }
    .detail h2 {
      margin: 2px 0 var(--s5);
      overflow-wrap: anywhere;
      font-size: 22px;
      font-weight: var(--fw-strong);
      line-height: 1.2;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--s4);
    }
    .field {
      min-width: 0;
      display: grid;
      gap: 6px;
    }
    .field.wide,
    .wide { grid-column: 1 / -1; }
    input,
    textarea {
      width: 100%;
      min-height: 38px;
      padding: 9px 11px;
      border: var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--ink);
    }
    textarea {
      min-height: 84px;
      resize: vertical;
    }
    .secret-input {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: var(--s2);
    }
    .secret-input input,
    .secret-input textarea {
      min-width: 0;
      flex: 1;
      font-family: var(--font-mono);
    }
    .secret-input .masked {
      background: var(--sunk);
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .secret-input.idle .linkbtn { display: none; }
    .linkbtn {
      min-height: 32px;
      padding: 6px var(--s1);
      border: 0;
      background: transparent;
      color: var(--live);
      font-weight: var(--fw-strong);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .linkbtn:disabled {
      cursor: not-allowed;
      opacity: .55;
      text-decoration: none;
    }
    .totp {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: var(--s5);
      padding: var(--s4) var(--s5);
      border: var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
    }
    .ring {
      position: relative;
      width: 64px;
      height: 64px;
      flex: none;
    }
    .ring svg { transform: rotate(-90deg); }
    .ring .seconds {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: var(--fw-strong);
      font-variant-numeric: tabular-nums;
    }
    .ring .progress { transition: stroke-dashoffset 250ms linear; }
    .totp-main {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .totp-code {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: var(--fs-code);
      font-weight: var(--fw-strong);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      line-height: 1;
    }
    .totp-sub {
      color: var(--muted);
      font-size: var(--fs-meta);
    }
    .totp-sub b {
      color: var(--live);
      font-weight: var(--fw-strong);
      font-variant-numeric: tabular-nums;
    }
    .totp-copy { margin-left: auto; }
    .btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 var(--s4);
      border: var(--border);
      border-radius: var(--r-md);
      background: #ffffff;
      color: var(--ink);
      font-weight: var(--fw-strong);
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
    }
    .btn:hover { background: var(--sunk); }
    .btn.primary {
      border-color: var(--ink);
      background: var(--ink);
      color: #ffffff;
    }
    .btn.primary:hover { background: #000000; }
    .btn.ghost { background: transparent; }
    .btn.danger {
      border-color: #E3B7AE;
      background: transparent;
      color: var(--danger);
    }
    .btn.danger:hover { background: #F7ECE9; }
    .btn.sm {
      min-height: 32px;
      padding: 0 var(--s3);
      font-size: 13px;
    }
    .btn:disabled,
    input:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: .55;
    }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: var(--s2);
      margin-top: var(--s4);
      padding-top: var(--s4);
      border-top: var(--border);
    }
    .actions .danger { margin-left: auto; }
    .inline-status {
      min-height: 18px;
      margin-top: var(--s3);
      color: var(--danger);
      font-size: var(--fs-meta);
      overflow-wrap: anywhere;
      text-align: left;
    }
    :focus-visible {
      outline: var(--focus);
      outline-offset: var(--focus-offset);
    }
    @media (max-width: 900px) {
      .app-shell { padding: var(--s4); }
      .bar { flex-wrap: wrap; }
      .path { display: none; }
      .bar-right {
        width: 100%;
        justify-content: space-between;
      }
      .status {
        max-width: none;
        text-align: left;
      }
      .main { grid-template-columns: 1fr; }
      .rail {
        border-right: 0;
        border-bottom: var(--border);
      }
      .grid { grid-template-columns: 1fr; }
      .totp { flex-wrap: wrap; }
      .totp-copy { margin-left: 0; }
      .secret-input {
        align-items: stretch;
        flex-direction: column;
      }
      .linkbtn { align-self: flex-start; }
      .actions .danger { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring .progress,
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="lock-shell" id="unlockView">
    <section class="lockcard" aria-labelledby="lockTitle">
      <svg class="seal" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
        <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10" stroke="currentColor" stroke-width="1.5"></path>
        <circle cx="12" cy="15" r="1.5" fill="currentColor"></circle>
        <path d="M12 16.5V18" stroke="currentColor" stroke-width="1.5"></path>
      </svg>
      <h1 id="lockTitle">Vault is locked</h1>
      <p>Enter your unlock key to decrypt this device's credentials.</p>
      <form id="unlockForm">
        <label for="vaultKey">Unlock key</label>
        <input class="mono" id="vaultKey" type="password" autocomplete="current-password" required autofocus>
        <div class="lockrow">
          <button class="btn primary" type="submit">Unlock</button>
          <button class="btn ghost" type="button" id="initButton">Initialize</button>
        </div>
        <div class="inline-status" id="unlockStatus" role="status" aria-live="polite"></div>
      </form>
      <p class="hint">key from WEBMCP_VAULT_KEY or local input; nothing leaves this machine</p>
    </section>
  </div>

  <div class="app-shell hidden" id="appView">
    <div class="app">
      <header class="bar">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.6"></path>
            <circle cx="12" cy="15" r="1.4" fill="currentColor"></circle>
          </svg>
          <h1>WebMCP Vault</h1>
          <span class="path">~/.webmcp/vault</span>
        </div>
        <div class="bar-right">
          <span class="count" id="itemCount"><b>0</b> items</span>
          <div class="status" id="status" role="status" aria-live="polite"></div>
          <button class="btn sm ghost" id="lockButton" type="button">Lock</button>
        </div>
      </header>

      <main class="main">
        <aside class="rail" aria-label="Saved logins">
          <div class="rail-top">
            <input class="search" id="search" autocomplete="off" placeholder="Search title, user, or site">
          </div>
          <div class="list" id="itemList" role="list"></div>
          <div class="rail-foot">
            <button class="btn sm primary" id="newButton" type="button">New</button>
            <button class="btn sm ghost" id="importButton" type="button">Import CSV</button>
            <button class="btn sm ghost" id="demoButton" type="button">Load demo</button>
            <input id="csvFile" type="file" accept=".csv,text/csv" class="hidden">
          </div>
        </aside>

        <section class="detail" aria-labelledby="detailTitle">
          <span class="eyebrow" id="detailEyebrow">New login</span>
          <h2 id="detailTitle">New Login</h2>
          <form id="itemForm" class="grid">
            <div class="field">
              <label for="title">Title</label>
              <input id="title" autocomplete="off" required maxlength="200">
            </div>
            <div class="field">
              <label for="web">Website</label>
              <input class="mono" id="web" autocomplete="url" maxlength="2048">
            </div>
            <div class="field">
              <label for="username">Username</label>
              <input class="mono" id="username" autocomplete="username" maxlength="512">
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="secret-input">
                <input class="mono" id="password" type="password" autocomplete="new-password" maxlength="8192">
                <button class="linkbtn" id="passwordRevealButton" type="button" disabled>Reveal</button>
              </div>
            </div>

            <div class="totp hidden" id="totpBlock">
              <div class="ring" aria-hidden="true">
                <svg width="64" height="64" viewBox="0 0 64 64">
                  <circle cx="32" cy="32" r="28" fill="none" stroke="var(--live-weak)" stroke-width="4"></circle>
                  <circle class="progress" id="totpRingProgress" cx="32" cy="32" r="28" fill="none" stroke="var(--live)" stroke-width="4" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="0"></circle>
                </svg>
                <span class="seconds" id="totpRingSeconds">30</span>
              </div>
              <div class="totp-main">
                <span class="eyebrow">One-time code</span>
                <span class="totp-code" id="totpCode">------</span>
                <span class="totp-sub">expires in <b id="totpSeconds">30s</b></span>
              </div>
              <button class="btn sm ghost totp-copy" id="copyTotpButton" type="button">Copy</button>
            </div>

            <div class="field wide">
              <label for="otpSecret">TOTP secret</label>
              <div class="secret-input">
                <input class="mono" id="otpSecret" type="password" autocomplete="off" maxlength="4096">
                <button class="linkbtn" id="otpSecretRevealButton" type="button" disabled>Reveal</button>
              </div>
            </div>
            <div class="field wide">
              <label for="note">Note</label>
              <div class="secret-input">
                <textarea class="mono" id="note" maxlength="20000"></textarea>
                <button class="linkbtn" id="noteRevealButton" type="button" disabled>Reveal</button>
              </div>
            </div>

            <div class="actions">
              <button class="btn primary" type="submit">Save</button>
              <button class="btn ghost" type="button" id="revealAllButton" disabled>Reveal all</button>
              <button class="btn danger" type="button" id="deleteButton" disabled>Delete</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script nonce="{{NONCE}}">
    const token = {{TOKEN_JSON}};
    const ringCircumference = 2 * Math.PI * 28;
    const mask = String.fromCharCode(8226).repeat(12);
    const state = {
      key: '',
      items: [],
      selectedId: '',
      selectedItem: null,
      revealed: { password: false, otpSecret: false, note: false },
      dirty: { password: false, otpSecret: false, note: false },
      otp: '',
      otpCounter: null,
      otpTimer: null,
      searchTimer: null,
    };
    const el = (id) => document.getElementById(id);
    const secretFields = ['password', 'otpSecret', 'note'];
    const secretConfig = {
      password: {
        inputId: 'password',
        toggleId: 'passwordRevealButton',
        apiField: 'password',
        savedFlag: 'hasPassword',
        label: 'Password',
        placeholder: 'Password',
      },
      otpSecret: {
        inputId: 'otpSecret',
        toggleId: 'otpSecretRevealButton',
        apiField: 'otp-secret',
        savedFlag: 'hasOtp',
        label: 'TOTP secret',
        placeholder: 'TOTP secret',
      },
      note: {
        inputId: 'note',
        toggleId: 'noteRevealButton',
        apiField: 'note',
        savedFlag: 'hasNote',
        label: 'Note',
        placeholder: 'Note',
      },
    };
    const demoItems = [
      {
        title: 'GitHub',
        web: 'https://github.com/login',
        username: 'octo@example.test',
        password: 'demo-github-password',
        otpSecret: 'JBSWY3DPEHPK3PXP',
        note: 'Synthetic demo login. Replace with a real entry only in your own vault.',
      },
      {
        title: 'Cloudflare',
        web: 'https://dash.cloudflare.com',
        username: 'ops@example.test',
        password: 'demo-cloudflare-password',
        otpSecret: 'otpauth://totp/WebMCP:ops?secret=JBSWY3DPEHPK3PXP&issuer=WebMCP&digits=6&period=30',
        note: 'Synthetic demo entry for checking the TOTP ring and redaction controls.',
      },
      {
        title: 'Fastmail',
        web: 'https://app.fastmail.com',
        username: 'me@example.test',
        password: 'demo-fastmail-password',
        note: 'No TOTP on this demo item, so the code ring stays hidden.',
      },
    ];

    function setStatus(message, kind = 'neutral') {
      const status = el('status');
      status.textContent = message || '';
      status.dataset.kind = kind;
    }

    function setUnlockStatus(message) {
      el('unlockStatus').textContent = message || '';
    }

    function setItemCount(count) {
      const label = count === 1 ? 'item' : 'items';
      el('itemCount').innerHTML = '<b>' + String(count) + '</b> ' + label;
    }

    async function api(path, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        'x-webmcp-vault-token': token,
      };
      if (state.key) headers['x-webmcp-vault-key'] = state.key;
      const response = await fetch('/api' + path, {
        method: options.method || 'GET',
        headers,
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || payload.error) throw new Error(payload.error || 'Request failed');
      return payload;
    }

    function showApp(show) {
      el('unlockView').classList.toggle('hidden', show);
      el('appView').classList.toggle('hidden', !show);
      if (!show) {
        stopTotp();
        setTimeout(() => el('vaultKey').focus(), 0);
      }
    }

    function hostFromWeb(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const parsed = new URL(raw.includes('://') ? raw : 'https://' + raw);
        return parsed.hostname.replace(/^www\\./, '');
      } catch {
        return raw.replace(/^https?:\\/\\//, '').replace(/^www\\./, '').split('/')[0];
      }
    }

    function hasSavedSecret(field) {
      const config = secretConfig[field];
      return Boolean(state.selectedItem && state.selectedItem[config.savedFlag]);
    }

    function hasAnySavedSecret() {
      return secretFields.some((field) => hasSavedSecret(field));
    }

    function allSavedSecretsRevealed() {
      return secretFields.every((field) => !hasSavedSecret(field) || state.revealed[field]);
    }

    function resetSecretState() {
      for (const field of secretFields) {
        state.revealed[field] = false;
        state.dirty[field] = false;
      }
    }

    function updateRevealAllButton() {
      const button = el('revealAllButton');
      button.disabled = !state.selectedId || !hasAnySavedSecret();
      button.textContent = allSavedSecretsRevealed() && hasAnySavedSecret() ? 'Hide all' : 'Reveal all';
    }

    function updateSecretUi(field) {
      const config = secretConfig[field];
      const input = el(config.inputId);
      const toggle = el(config.toggleId);
      const shell = input.closest('.secret-input');
      const saved = hasSavedSecret(field);
      const revealed = state.revealed[field];
      const dirty = state.dirty[field];
      const masked = Boolean(state.selectedId && saved && !revealed && !dirty);
      const idle = !state.selectedId || !saved;

      if (field !== 'note') input.type = revealed ? 'text' : 'password';
      shell?.classList.toggle('idle', idle);
      input.classList.toggle('masked', masked);
      input.placeholder = masked ? mask : config.placeholder;
      input.readOnly = field === 'note' && masked;
      toggle.disabled = !state.selectedId || !saved;
      toggle.textContent = revealed ? 'Hide' : 'Reveal';
      toggle.setAttribute('aria-label', (revealed ? 'Hide ' : 'Reveal ') + config.label.toLowerCase());
      updateRevealAllButton();
    }

    function formPayload() {
      const payload = {
        title: el('title').value,
        web: el('web').value,
        username: el('username').value,
      };
      for (const field of secretFields) {
        if (!state.selectedId || state.revealed[field] || state.dirty[field]) {
          payload[field] = el(secretConfig[field].inputId).value;
        }
      }
      return payload;
    }

    function fillForm(item = {}) {
      stopTotp();
      state.selectedId = item.id || '';
      state.selectedItem = item.id ? item : null;
      resetSecretState();
      state.revealed.password = Object.prototype.hasOwnProperty.call(item, 'password');
      state.revealed.otpSecret = Object.prototype.hasOwnProperty.call(item, 'otpSecret');
      state.revealed.note = Object.prototype.hasOwnProperty.call(item, 'note');
      el('title').value = item.title || '';
      el('web').value = item.web || '';
      el('username').value = item.username || '';
      el('password').value = item.password || '';
      el('otpSecret').value = item.otpSecret || '';
      el('note').value = item.note || '';
      el('detailEyebrow').textContent = state.selectedId ? 'Login' : 'New login';
      el('detailTitle').textContent = item.title || 'New Login';
      el('deleteButton').disabled = !state.selectedId;
      for (const field of secretFields) updateSecretUi(field);
      updateTotpBlock();
      renderList();
    }

    function renderList() {
      const list = el('itemList');
      list.textContent = '';
      if (state.items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        const query = el('search').value.trim();
        if (query) {
          empty.textContent = 'No logins match "' + query + '".';
          list.append(empty);
          return;
        }
        const title = document.createElement('strong');
        title.textContent = 'No logins yet';
        const copy = document.createElement('p');
        copy.textContent = 'Add one manually, import a CSV, or load synthetic demo rows.';
        const actions = document.createElement('div');
        actions.className = 'empty-actions';
        const newButton = document.createElement('button');
        newButton.className = 'btn sm primary';
        newButton.type = 'button';
        newButton.textContent = 'New';
        newButton.addEventListener('click', () => fillForm());
        const demoButton = document.createElement('button');
        demoButton.className = 'btn sm ghost';
        demoButton.type = 'button';
        demoButton.textContent = 'Load demo';
        demoButton.addEventListener('click', () => loadDemoItems().catch((err) => setStatus(err.message, 'error')));
        actions.append(newButton, demoButton);
        empty.append(title, copy, actions);
        list.append(empty);
        return;
      }
      for (const item of state.items) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'item' + (item.id === state.selectedId ? ' active' : '');
        button.setAttribute('role', 'listitem');
        if (item.id === state.selectedId) button.setAttribute('aria-current', 'true');
        const title = document.createElement('strong');
        title.className = 'name';
        title.textContent = item.title || '(untitled)';
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = [item.username, hostFromWeb(item.web)].filter(Boolean).join(' ' + String.fromCharCode(183) + ' ');
        button.append(title, meta);
        button.addEventListener('click', () => selectItem(item.id));
        list.append(button);
      }
    }

    async function loadItems() {
      const search = encodeURIComponent(el('search').value.trim());
      const payload = await api('/items' + (search ? '?search=' + search : ''));
      state.items = payload.items || [];
      renderList();
      setItemCount(payload.count ?? state.items.length);
    }

    function demoKey(item) {
      return hostFromWeb(item.web) + '|' + String(item.username || '').toLowerCase();
    }

    async function loadDemoItems() {
      if (state.items.length > 0 && !confirm('Add synthetic demo logins to this vault?')) return;
      const existing = new Set(state.items.map(demoKey));
      const created = [];
      let skipped = 0;
      for (const item of demoItems) {
        if (existing.has(demoKey(item))) {
          skipped += 1;
          continue;
        }
        const payload = await api('/items', { method: 'POST', body: item });
        if (payload.item) created.push(payload.item);
      }
      await loadItems();
      if (created[0]?.id) await selectItem(created[0].id);
      else if (state.items[0]?.id) await selectItem(state.items[0].id);
      setStatus('Loaded ' + created.length + ' demo item(s)' + (skipped ? ', skipped ' + skipped : ''), 'success');
    }

    async function selectItem(id) {
      const payload = await api('/items/' + encodeURIComponent(id));
      fillForm(payload.item);
    }

    async function revealField(field) {
      if (!state.selectedId) return;
      const config = secretConfig[field];
      if (state.revealed[field]) {
        state.revealed[field] = false;
        state.dirty[field] = false;
        el(config.inputId).value = '';
        updateSecretUi(field);
        setStatus(config.label + ' hidden');
        return;
      }
      const payload = await api(
        '/items/' + encodeURIComponent(state.selectedId) + '/read?field=' +
          encodeURIComponent(config.apiField),
      );
      el(config.inputId).value = String(payload.value || '');
      state.revealed[field] = true;
      state.dirty[field] = false;
      updateSecretUi(field);
      setStatus(config.label + ' revealed');
    }

    async function revealAll() {
      if (!state.selectedId) return;
      if (allSavedSecretsRevealed()) {
        for (const field of secretFields) {
          state.revealed[field] = false;
          state.dirty[field] = false;
          el(secretConfig[field].inputId).value = '';
          updateSecretUi(field);
        }
        setStatus('Secrets hidden');
        return;
      }
      const payload = await api('/items/' + encodeURIComponent(state.selectedId) + '?reveal=1');
      fillForm(payload.item);
      setStatus('Secrets revealed');
    }

    function markSecretDirty(field) {
      if (!state.revealed[field]) {
        state.dirty[field] = el(secretConfig[field].inputId).value.length > 0;
        updateSecretUi(field);
      }
    }

    function formatOtp(value) {
      const raw = String(value || '').replace(/\\s+/g, '');
      if (raw.length === 6) return raw.slice(0, 3) + ' ' + raw.slice(3);
      if (raw.length === 8) return raw.slice(0, 4) + ' ' + raw.slice(4);
      return raw || '------';
    }

    function stopTotp() {
      if (state.otpTimer) clearInterval(state.otpTimer);
      state.otpTimer = null;
      state.otpCounter = null;
      state.otp = '';
    }

    function updateTotpBlock() {
      const show = Boolean(state.selectedItem && state.selectedItem.hasOtp);
      el('totpBlock').classList.toggle('hidden', !show);
      if (!show) {
        stopTotp();
        return;
      }
      el('totpCode').textContent = '------';
      startTotp();
    }

    async function refreshTotpCode() {
      if (!state.selectedId || !state.selectedItem?.hasOtp) return;
      const selectedId = state.selectedId;
      try {
        const payload = await api('/items/' + encodeURIComponent(selectedId) + '/read?field=otp');
        if (selectedId !== state.selectedId) return;
        state.otp = String(payload.value || '');
        el('totpCode').textContent = formatOtp(state.otp);
      } catch (err) {
        setStatus(err.message, 'error');
      }
    }

    function updateTotpClock() {
      if (el('totpBlock').classList.contains('hidden')) return;
      const period = 30;
      const nowSeconds = Math.floor(Date.now() / 1000);
      const counter = Math.floor(nowSeconds / period);
      const seconds = period - (nowSeconds % period);
      const offset = ringCircumference * (1 - seconds / period);
      el('totpRingProgress').setAttribute('stroke-dashoffset', offset.toFixed(1));
      el('totpRingSeconds').textContent = String(seconds);
      el('totpSeconds').textContent = String(seconds) + 's';
      if (state.otpCounter !== counter) {
        state.otpCounter = counter;
        refreshTotpCode();
      }
    }

    function startTotp() {
      stopTotp();
      updateTotpClock();
      state.otpTimer = setInterval(updateTotpClock, 250);
    }

    async function copyText(value, label) {
      const text = String(value || '');
      if (!text) {
        setStatus(label + ' is empty', 'error');
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          prompt('Copy ' + label, text);
        }
        setStatus('Copied ' + label, 'success');
      } catch (err) {
        setStatus(err.message || 'Copy failed', 'error');
      }
    }

    el('unlockForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      state.key = el('vaultKey').value;
      try {
        await loadItems();
        fillForm();
        showApp(true);
        setUnlockStatus('');
        setStatus('Unlocked', 'success');
      } catch (err) {
        setUnlockStatus(err.message);
      }
    });

    el('initButton').addEventListener('click', async () => {
      state.key = el('vaultKey').value;
      try {
        await api('/init', { method: 'POST' });
        await loadItems();
        fillForm();
        showApp(true);
        setUnlockStatus('');
        setStatus('Vault initialized', 'success');
      } catch (err) {
        setUnlockStatus(err.message);
      }
    });

    el('itemForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        let saved;
        if (state.selectedId) {
          saved = await api('/items/' + encodeURIComponent(state.selectedId), {
            method: 'PUT',
            body: formPayload(),
          });
        } else {
          saved = await api('/items', { method: 'POST', body: formPayload() });
        }
        await loadItems();
        if (saved?.item?.id) await selectItem(saved.item.id);
        else fillForm();
        setStatus('Saved', 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    });

    el('deleteButton').addEventListener('click', async () => {
      if (!state.selectedId || !confirm('Delete this vault item?')) return;
      try {
        await api('/items/' + encodeURIComponent(state.selectedId), { method: 'DELETE' });
        await loadItems();
        fillForm();
        setStatus('Deleted', 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
    });

    el('passwordRevealButton').addEventListener('click', () => revealField('password').catch((err) => setStatus(err.message, 'error')));
    el('otpSecretRevealButton').addEventListener('click', () => revealField('otpSecret').catch((err) => setStatus(err.message, 'error')));
    el('noteRevealButton').addEventListener('click', () => revealField('note').catch((err) => setStatus(err.message, 'error')));
    el('revealAllButton').addEventListener('click', () => revealAll().catch((err) => setStatus(err.message, 'error')));
    el('newButton').addEventListener('click', () => fillForm());
    el('demoButton').addEventListener('click', () => loadDemoItems().catch((err) => setStatus(err.message, 'error')));
    el('importButton').addEventListener('click', () => el('csvFile').click());
    el('csvFile').addEventListener('change', async () => {
      const file = el('csvFile').files[0];
      if (!file) return;
      try {
        const csv = await file.text();
        const summary = await api('/import', { method: 'POST', body: { csv } });
        await loadItems();
        setStatus('Imported ' + summary.createdCount + ', skipped ' + summary.skipped +
          (summary.errors && summary.errors.length ? ', ' + summary.errors.length + ' error(s)' : ''), 'success');
      } catch (err) {
        setStatus(err.message, 'error');
      }
      el('csvFile').value = '';
    });
    el('lockButton').addEventListener('click', () => {
      state.key = '';
      state.items = [];
      fillForm();
      el('vaultKey').value = '';
      showApp(false);
      setStatus('');
      setItemCount(0);
    });
    el('search').addEventListener('input', () => {
      clearTimeout(state.searchTimer);
      state.searchTimer = setTimeout(() => {
        loadItems().catch((err) => setStatus(err.message, 'error'));
      }, 180);
    });
    el('copyTotpButton').addEventListener('click', async () => {
      if (!state.otp) await refreshTotpCode();
      await copyText(state.otp, 'one-time code');
    });
    for (const field of secretFields) {
      el(secretConfig[field].inputId).addEventListener('input', () => markSecretDirty(field));
    }
    fillForm();
  </script>
</body>
</html>
